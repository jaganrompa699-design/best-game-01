<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Harvest — a wave arcade game</title>
<style>
  html, body { margin: 0; padding: 0; background: #070b1d; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: min(100vw, 1280px); }
  canvas { display: block; width: 100%; height: auto; background: #070b1d; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #hint { position: absolute; left: 0; right: 0; bottom: -28px; text-align: center; color: #9aa5d6; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800" aria-label="Pulse Harvest game canvas"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="hint">WASD or arrows to move · mouse to aim · hold click to fire · Space to dash · P pause · M mute</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
